[project]
name = "timesyncbot"
version = "1.0.0"
description = "Telegram bot for VyatSU student schedule management, free rooms lookup, and group meeting finder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.25.0",
    "aiohttp>=3.13.3",
    "aiofiles>=23.2.1",
    "aiosqlite>=0.22.1",
    "apscheduler>=3.11.2",
    "beautifulsoup4>=4.14.3",
    "selectolax>=0.3.21",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.35",
    "pymupdf>=1.25.3",
    "pdfplumber>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tgbot"]
